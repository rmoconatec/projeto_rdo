services:
  app:
    image: node:22-alpine
    ports:
      - "3000:3000"
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/rdo_db
      NODE_ENV: development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "npm install && npx drizzle-kit push --force && npm run dev"
    volumes:
      - .:/app
